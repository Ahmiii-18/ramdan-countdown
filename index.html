<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramadan Countdown</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="overlay"></div>

<div class="container" id="countdown-page">
  <h1>🌙 Ramadan Countdown</h1>
  <div id="hijri-date">Loading Hijri Date...</div>

  <select id="city-select">
    <option value="Lahore">Lahore</option>
    <option value="Karachi">Karachi</option>
    <option value="Islamabad">Islamabad</option>
    <option value="Multan">Multan</option>
  </select>

  <h2 id="event-name">Loading...</h2>
  <div id="countdown">00:00:00</div>

  <div id="additional-countdowns">
    <div class="single-countdown">
      <h3 class="single-countdown-text">Sehri Time</h3>
      <div class="inner-countdown" id="sehri-countdown">00:00 AM</div>
    </div>
    <div class="single-countdown">
      <h3 class="single-countdown-text">Iftar Time</h3>
      <div class="inner-countdown" id="iftar-countdown">00:00 PM</div>
    </div>
  </div>

  <button id="show-calendar">Show Ramadan Calendar</button>
</div>

<div class="container" id="calendar-page">
  <h1>🌙 Ramadan Calendar</h1>
  <div class="calendar-wrapper">
    <table id="ramadan-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Sehri</th>
          <th>Iftar</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <button id="back-to-countdown">← Back to Countdown</button>
   <a href="https://www.islamicfinder.org/ramadan-calendar/" target="_blank" rel="noopener" id="external-calendar-link">
    View Full Ramadan Calendar on IslamicFinder
  </a>
  </div>

<audio id="azanAudio" src="azan.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
